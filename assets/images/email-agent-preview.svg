<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="n8nGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glowLight">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#n8nGrad)" stroke="#FF6584" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Canvas Grid Dots -->
  <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.4"/>
  </pattern>
  <rect width="600" height="360" rx="12" fill="url(#dotGrid)"/>

  <!-- Top bar -->
  <rect width="600" height="38" rx="12" fill="#090E1A"/>
  <circle cx="24" cy="19" r="5" fill="#EF4444"/>
  <circle cx="42" cy="19" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="19" r="5" fill="#10B981"/>
  <text x="80" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FF6584">n8n Workflow · NovaBrief Email Agent v2.4</text>
  <rect x="490" y="9" width="90" height="20" rx="4" fill="#10B981" fill-opacity="0.15"/>
  <text x="535" y="23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">EXECUTING</text>

  <!-- Node Connector Lines with gradient & pulses -->
  <path d="M 120 180 C 170 180, 170 140, 220 140" fill="none" stroke="#FF6584" stroke-width="2.5" stroke-dasharray="4,4"/>
  <path d="M 330 140 C 370 140, 370 180, 410 180" fill="none" stroke="#00C2FF" stroke-width="2.5"/>
  <path d="M 330 140 C 370 140, 370 260, 410 260" fill="none" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Node 1: Webhook / Gmail Ingestion -->
  <g transform="translate(40, 140)">
    <rect width="90" height="80" rx="8" fill="#1E293B" stroke="#FF6584" stroke-width="1.5" filter="url(#glowLight)"/>
    <rect x="8" y="8" width="74" height="18" rx="3" fill="#FF6584" fill-opacity="0.2"/>
    <text x="45" y="21" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#FF6584">IMAP / WEBHOOK</text>
    <text x="45" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#F8FAFC">New Email</text>
    <text x="45" y="66" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94A3B8">Trigger Event</text>
  </g>

  <!-- Node 2: Context Analyzer & LLM Processor -->
  <g transform="translate(220, 100)">
    <rect width="120" height="85" rx="8" fill="#1E293B" stroke="#00C2FF" stroke-width="2" filter="url(#glowLight)"/>
    <rect x="8" y="8" width="104" height="18" rx="3" fill="#00C2FF" fill-opacity="0.2"/>
    <text x="60" y="21" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#00C2FF">LLM REASONING</text>
    <text x="60" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#F8FAFC">Intent Analysis</text>
    <text x="60" y="68" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38BDF8">Groq / Llama 3.3</text>
  </g>

  <!-- Node 3: Automated Human-like Reply -->
  <g transform="translate(410, 140)">
    <rect width="130" height="80" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <rect x="8" y="8" width="114" height="18" rx="3" fill="#10B981" fill-opacity="0.2"/>
    <text x="65" y="21" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="9" font-weight="700" fill="#10B981">AUTO DISPATCH</text>
    <text x="65" y="48" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" fill="#F8FAFC">Send Draft / Reply</text>
    <text x="65" y="66" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" fill="#34D399">Zero Latency</text>
  </g>

  <!-- Node 4: Fallback / Flag to Human -->
  <g transform="translate(410, 235)">
    <rect width="130" height="60" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.2"/>
    <rect x="8" y="6" width="114" height="16" rx="3" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="65" y="18" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="8" font-weight="700" fill="#F59E0B">HIGH CONFIDENCE GATE</text>
    <text x="65" y="44" text-anchor="middle" font-family="'Inter', sans-serif" font-size="10" fill="#E2E8F0">Flag Urgent Query</text>
  </g>

  <rect x="40" y="295" width="300" height="35" rx="6" fill="#0c1322" stroke="rgba(255,255,255,0.1)"/>
  <text x="55" y="317" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94A3B8">⚡ 94% Auto-Resolution Rate · 0 Manual Hours</text>
</svg>
