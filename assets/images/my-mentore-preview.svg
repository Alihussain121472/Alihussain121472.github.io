    <text x="302" y="400" fill="#777f9a" font-family="Inter, Arial, sans-serif" font-size="10">Practice with a short check</text>
    <circle cx="537" cy="365" r="14" fill="#e4f8f4"/>
    <path d="M531 365h12m-6-6v12" stroke="#2e9f91" stroke-width="2" stroke-linecap="round"/>
    <text x="562" y="363" fill="#202644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700">Portfolio project</text>
    <text x="530" y="400" fill="#777f9a" font-family="Inter, Arial, sans-serif" font-size="10">Turn learning into something real</text>
