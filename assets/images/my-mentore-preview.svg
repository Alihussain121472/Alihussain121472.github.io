    <rect x="304" y="181" width="388" height="72" rx="11" fill="#f1f2ff"/>
    <rect x="320" y="197" width="40" height="40" rx="10" fill="url(#accent)"/>
    <path d="M337 207v20m-7-7 7 7 7-7" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="375" y="209" fill="#202644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Short lesson</text>
    <text x="375" y="229" fill="#777f9a" font-family="Inter, Arial, sans-serif" font-size="10">Learn a concept, then apply it</text>
    <rect x="304" y="270" width="388" height="22" rx="11" fill="#e7e8f3"/>
