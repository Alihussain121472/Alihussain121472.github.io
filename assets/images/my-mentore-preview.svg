<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">MY Mentore learning workspace illustration</title>
  <desc id="desc">A roadmap connects study lessons, quizzes, and portfolio projects.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11162c"/>
      <stop offset="1" stop-color="#25215c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b8eff"/>
      <stop offset="1" stop-color="#62d9ca"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#050714" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="760" height="500" rx="22" fill="url(#backdrop)"/>
  <circle cx="680" cy="65" r="170" fill="#7c7fff" opacity=".10"/>
  <circle cx="54" cy="450" r="150" fill="#56d6c4" opacity=".08"/>
  <text x="46" y="64" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="700">MY Mentore</text>
  <text x="47" y="91" fill="#b8bfdc" font-family="Inter, Arial, sans-serif" font-size="12" letter-spacing="2">STUDY · PRACTICE · CAREER</text>
  <rect x="558" y="40" width="155" height="34" rx="17" fill="#ffffff" fill-opacity=".10" stroke="#ffffff" stroke-opacity=".12"/>
  <circle cx="578" cy="57" r="5" fill="#62d9ca"/>
  <text x="592" y="62" fill="#dce2f7" font-family="Inter, Arial, sans-serif" font-size="12">Your study plan</text>
  <g filter="url(#shadow)">
    <rect x="42" y="122" width="214" height="326" rx="16" fill="#fbfcff"/>
    <text x="64" y="158" fill="#1b2140" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700">Your roadmap</text>
    <text x="64" y="180" fill="#777f9a" font-family="Inter, Arial, sans-serif" font-size="11">Build a path, one step at a time</text>
    <path d="M76 219v176" stroke="#d8dcf0" stroke-width="3" stroke-linecap="round"/>
    <circle cx="76" cy="225" r="8" fill="#6e70f5"/>
    <circle cx="76" cy="282" r="8" fill="#62c7ba"/>
    <circle cx="76" cy="339" r="8" fill="#c7cbe0"/>
    <circle cx="76" cy="396" r="8" fill="#c7cbe0"/>
    <text x="96" y="222" fill="#202644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Study foundations</text>
    <text x="96" y="240" fill="#777f9a" font-family="Inter, Arial, sans-serif" font-size="10">Lessons and practice</text>
    <text x="96" y="279" fill="#202644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Check understanding</text>
    <text x="96" y="297" fill="#777f9a" font-family="Inter, Arial, sans-serif" font-size="10">Short quizzes</text>
    <text x="96" y="336" fill="#202644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Make a project</text>
    <text x="96" y="354" fill="#777f9a" font-family="Inter, Arial, sans-serif" font-size="10">Practice through projects</text>
    <text x="96" y="393" fill="#202644" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="600">Prepare for next steps</text>
    <text x="96" y="411" fill="#777f9a" font-family="Inter, Arial, sans-serif" font-size="10">Career preparation</text>
