<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="dhaGrad" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#0E2340"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="12" fill="url(#dhaGrad)" stroke="#00F5D4" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Top bar -->
  <rect width="600" height="38" rx="12" fill="#040A14"/>
  <circle cx="24" cy="19" r="5" fill="#EF4444"/>
  <circle cx="42" cy="19" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="19" r="5" fill="#10B981"/>
  <text x="80" y="24" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" fill="#00F5D4">DHA Multan AI · Real Estate Advisor Engine</text>
  <rect x="495" y="9" width="85" height="20" rx="4" fill="#00C2FF" fill-opacity="0.2"/>
  <text x="537" y="23" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#00C2FF">24/7 ONLINE</text>

  <!-- Left Map / Sector Intelligence -->
