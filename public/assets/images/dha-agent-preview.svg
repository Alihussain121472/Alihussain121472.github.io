  <text x="35" y="78" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">Sector Valuation Matrix</text>
  <line x1="35" y1="90" x2="225" y2="90" stroke="#1E293B"/>

  <!-- Sector breakdown -->
  <rect x="35" y="105" width="190" height="42" rx="6" fill="#0F1F38"/>
  <text x="45" y="122" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#00F5D4">Sector M (1 Kanal)</text>
  <text x="45" y="137" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Avg PKR 1.45 Cr · +8.2% Q3</text>

  <rect x="35" y="155" width="190" height="42" rx="6" fill="#0F1F38"/>
  <text x="45" y="172" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38BDF8">Sector Q (10 Marla)</text>
  <text x="45" y="187" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">Avg PKR 85 Lacs · High Liquidity</text>

  <rect x="35" y="205" width="190" height="42" rx="6" fill="#0F1F38"/>
  <text x="45" y="222" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#A78BFA">Commercial Broadway</text>
  <text x="45" y="237" font-family="'Inter', sans-serif" font-size="9" fill="#94A3B8">High ROI · Investor Inquiries Peak</text>

  <!-- Interactive Chat Stream -->
  <rect x="255" y="52" width="325" height="290" rx="8" fill="#091322" stroke="rgba(0,194,255,0.15)"/>
  
  <!-- Chat bubble 1: User -->
  <rect x="340" y="70" width="225" height="50" rx="8" fill="#00C2FF" fill-opacity="0.15" stroke="rgba(0,194,255,0.3)"/>
  <text x="352" y="90" font-family="'Inter', sans-serif" font-size="10" fill="#F1F5F9">What is the best investment sector</text>
  <text x="352" y="106" font-family="'Inter', sans-serif" font-size="10" fill="#F1F5F9">in DHA Multan under 1.2 Crore?</text>

  <!-- Chat bubble 2: AI Agent -->
  <rect x="270" y="132" width="295" height="130" rx="8" fill="#0E1E36" stroke="rgba(0,245,212,0.3)"/>
  <text x="282" y="152" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700" fill="#00F5D4">🤖 DHA Multan Intelligence Agent</text>
  <text x="282" y="174" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">Based on current transaction volumes and</text>
  <text x="282" y="190" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">possession timelines, <tspan fill="#38BDF8" font-weight="bold">Sector V (1 Kanal)</tspan> and</text>
  <text x="282" y="206" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1"><tspan fill="#38BDF8" font-weight="bold">Sector R</tspan> offer optimal risk-adjusted returns</text>
  <text x="282" y="222" font-family="'Inter', sans-serif" font-size="10" fill="#CBD5E1">with 14-18% projected annual appreciation.</text>
  <rect x="282" y="234" width="115" height="18" rx="3" fill="#10B981" fill-opacity="0.2"/>
  <text x="339" y="247" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34D399">Verified by Deed Data</text>

  <!-- Input simulator -->
  <rect x="270" y="280" width="295" height="42" rx="6" fill="#060C16" stroke="#1E293B"/>
  <text x="285" y="306" font-family="'Inter', sans-serif" font-size="10" fill="#64748B">Ask property query or calculate transfer fee...</text>
</svg>
