<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14090c"/>
      <stop offset="50%" stop-color="#1e0f14"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#FF6B8B"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad2)" stroke="#FF3366" stroke-width="2"/>

  <!-- Ornate Corner Accents -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#FF3366" stroke-width="3"/>
  <path d="M 770 60 L 770 30 L 740 30" fill="none" stroke="#FF3366" stroke-width="3"/>
  <path d="M 30 440 L 30 470 L 60 470" fill="none" stroke="#FF3366" stroke-width="3"/>
  <path d="M 770 440 L 770 470 L 740 470" fill="none" stroke="#FF3366" stroke-width="3"/>

  <!-- Border Lines -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="rgba(255, 51, 102, 0.2)" stroke-dasharray="6,6"/>
  <line x1="60" y1="410" x2="740" y2="410" stroke="rgba(255, 51, 102, 0.2)" stroke-dasharray="6,6"/>

  <!-- Header / Shield Badge -->
  <g transform="translate(400, 65)">
    <circle r="28" fill="#2d0c15" stroke="#FF3366" stroke-width="2"/>
    <text text-anchor="middle" y="6" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#FFD700">CS50</text>
  </g>

  <!-- Issuer -->
  <text x="400" y="130" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="15" letter-spacing="4" fill="#E2E8F0">HARVARD UNIVERSITY</text>

  <!-- Title -->
  <text x="400" y="170" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="15" letter-spacing="2" fill="#FF3366">CERTIFICATE OF ACCOMPLISHMENT</text>
  
  <text x="400" y="215" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">CS50's Introduction to Programming</text>
  <text x="400" y="248" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="600" fill="#00C2FF">with Python</text>

  <!-- Recipient -->
  <text x="400" y="285" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#8899AA">CONFERRED UPON</text>
  <text x="400" y="322" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="url(#crimsonGrad)">Syed Ali Hussain</text>

  <text x="400" y="360" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#A0AEC0">
    Under the instruction of David J. Malan · Gordon McKay Professor of the Practice of Computer Science
  </text>

  <!-- Footer Information -->
  <g transform="translate(100, 440)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899AA">PROGRAM: CS50P</text>
  </g>

  <g transform="translate(400, 440)">
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFD700">HARVARD CERTIFIED</text>
  </g>

  <g transform="translate(700, 440)">
    <text x="0" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899AA">VERIFIED COURSE</text>
  </g>
</svg>
