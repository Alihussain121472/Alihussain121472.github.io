<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="50%" stop-color="#112233"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00C2FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad3)" stroke="#00F5D4" stroke-width="2"/>

  <!-- Ornate Corner Accents -->
  <path d="M 30 60 L 30 30 L 60 30" fill="none" stroke="#00F5D4" stroke-width="3"/>
  <path d="M 770 60 L 770 30 L 740 30" fill="none" stroke="#00F5D4" stroke-width="3"/>
  <path d="M 30 440 L 30 470 L 60 470" fill="none" stroke="#00F5D4" stroke-width="3"/>
  <path d="M 770 440 L 770 470 L 740 470" fill="none" stroke="#00F5D4" stroke-width="3"/>

  <!-- Border Lines -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="rgba(0, 245, 212, 0.2)" stroke-dasharray="6,6"/>
  <line x1="60" y1="410" x2="740" y2="410" stroke="rgba(0, 245, 212, 0.2)" stroke-dasharray="6,6"/>

  <!-- Header / Badge -->
  <g transform="translate(400, 65)">
    <circle r="28" fill="#082329" stroke="#00F5D4" stroke-width="2"/>
    <text text-anchor="middle" y="6" font-family="'Space Grotesk', sans-serif" font-size="13" font-weight="bold" fill="#00F5D4">AIEYS</text>
  </g>

  <!-- Issuer -->
  <text x="400" y="130" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" letter-spacing="4" fill="#8899AA">AI-EXPLAIN YOU SCIENCE</text>

  <!-- Title -->
  <text x="400" y="170" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="15" letter-spacing="2" fill="#00F5D4">PROFESSIONAL CERTIFICATION</text>
  
  <text x="400" y="225" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="700" fill="#FFFFFF">AI-Enhanced Teaching</text>

  <!-- Recipient -->
  <text x="400" y="275" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" fill="#8899AA">AWARDED TO</text>
  <text x="400" y="315" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700" fill="url(#emeraldGrad)">Syed Ali Hussain</text>

  <text x="400" y="355" text-anchor="middle" font-family="'Inter', sans-serif" font-size="13" fill="#A0AEC0">
    In recognition of advanced competency in integrating AI tools, pedagogical automation, and cognitive workflows.
  </text>

  <!-- Footer Information -->
  <g transform="translate(100, 440)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899AA">ISSUED: 11 APR 2026</text>
  </g>

  <g transform="translate(400, 440)">
    <text x="0" y="0" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00C2FF">ACCREDITED</text>
  </g>

  <g transform="translate(700, 440)">
    <text x="0" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#8899AA">ID: AIEYS-ED-2026</text>
  </g>
